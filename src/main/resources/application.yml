server:
  port: 8080

spring:
  application:
    name: relay-controller
  main:
    banner-mode: off
    log-startup-info: false
  profiles:
    active: dev
    group:
      dev: mtls
      prod: mtls
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${ENC(${DATASOURCE_PASSWORD})}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.huawei.devbridge.relaycontroller.infrastructure.persistence.entity
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: WARN
    com.baomidou.mybatisplus.core.toolkit.Sequence: OFF
    com.huawei.clouds.wushan.pkitoken.iam: OFF
    org.flywaydb.core.internal.database.base.Database: ERROR
    com.huawei.devbridge.relaycontroller.RelayControllerApplication: INFO
    com.huawei.devbridge.relaycontroller.application.service: INFO
    com.huawei.devbridge.relaycontroller.common.exception: WARN

wushan:
  integration:
    auth:
      new-resource-tag-check-enabled: true
  security:
    validator:
      enabled: false
  scc:
    crypto:
      enabled: true
      primary-key-store-file: /opt/cloud/scc/ks/primary.ks
      standby-key-store-file: /opt/cloud/scc/ks/standby.ks
      backup-folder-name: /opt/cloud/scc/backup
      domain-count: 8
      log-path: /opt/cloud/scc/logs
      log-file: scc
      default-algorithm: ALG_AES256_GCM

relay:
  domain: ${RELAY_DOMAIN}
  region: ${RELAY_REGION}
  default-expiration-hours: 72
  tunnel:
    cleanup-retention-days: 3
    cleanup-initial-delay-ms: 3600000
    cleanup-interval-ms: 3600000
  rate-limit:
    enabled: true
    requests-per-minute: ${RELAY_RATE_LIMIT_REQUESTS_PER_MINUTE}
  jwt:
    issuer: devbridge
    audience: relay-gateway
    key-id: "1"
    private-key: ${RELAY_JWT_PRIVATE_KEY:}
    token:
      ttl-seconds: 86400
  billing:
    default-plan-code: trial
    enforcement-enabled: true
    settlement-enabled: true
    settlement-cron: "0 */10 * * * *"
    settlement-batch-size: 500
    status-report-interval-seconds: 10
    activity-refresh-interval-seconds: 300
    status-retention-seconds: 86400
    status-max-clock-skew-seconds: 300
