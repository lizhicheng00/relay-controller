openapi: 3.0.3
info:
  title: DevBridge Management API
  version: 1.0.0
  description: Maps trusted cloud identities to DevBridge namespaces and API keys.
servers:
  - url: https://localhost:8443
paths:
  /v1/api-key:
    post:
      summary: Get a cloud user's default API key
      description: >-
        Called by the trusted identity layer after browser login. The service creates the
        user's namespace on first use and returns the same `devbridge` default API key on
        later calls.
      security:
        - trustedIdentityProxy: []
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User identity, namespaces, and default API key
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me:
    get:
      summary: Get the identity mapped to an API key
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Current user identity and namespaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/api-keys:
    get:
      summary: List API keys for the current namespace
      description: Returns metadata and masks only. Complete API key values are never listed.
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: API keys ordered with the default key first
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/APIKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create an additional API key
      description: >-
        Creates one of at most four additional API keys. The complete value is returned only
        in this response and cannot be retrieved later. The requested scenario determines
        whether the value starts with `devbridge_` or `devbox_`.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: Additional API key created
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAPIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/api-keys/{keyId}:
    delete:
      summary: Delete an additional API key
      description: The default API key cannot be deleted.
      security:
        - apiKeyAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            pattern: '^key_[a-z2-7]{26}$'
      responses:
        '204':
          description: API key deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    trustedIdentityProxy:
      type: apiKey
      in: header
      name: X-DevBridge-Proxy-Token
      description: Internal credential held by the trusted identity layer.
  parameters:
    DomainId:
      name: X-Domain-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    NoStore:
      schema:
        type: string
        example: no-store
  schemas:
    Identity:
      type: object
      required: [domainId, userId, accountNamespace, namespace]
      properties:
        domainId:
          type: string
        userId:
          type: string
        accountNamespace:
          type: string
        namespace:
          type: string
    ProvisionedCredential:
      allOf:
        - $ref: '#/components/schemas/Identity'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              $ref: '#/components/schemas/APIKeyValue'
    APIKey:
      type: object
      required: [id, name, scenario, mask, isDefault, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        scenario:
          $ref: '#/components/schemas/APIKeyScenario'
        mask:
          type: string
          example: devbridge_abcd...1234
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
    IssuedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              $ref: '#/components/schemas/APIKeyValue'
    APIKeyValue:
      type: string
      pattern: '^(devbridge|devbox)_[A-Za-z0-9_-]{32}$'
      description: Scenario prefix followed by a 32-character unpadded Base64URL payload.
    APIKeyScenario:
      type: string
      enum: [devbridge, devbox]
    CreateAPIKeyRequest:
      type: object
      required: [name, scenario]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A client or usage-scenario label. The name `default` is reserved.
        scenario:
          $ref: '#/components/schemas/APIKeyScenario'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [code, target, message]
      properties:
        code:
          type: string
        target:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: API key not found in the current namespace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: API key name, limit, or default-key conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
