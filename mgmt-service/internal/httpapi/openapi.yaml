openapi: 3.0.3
info:
  title: DevBridge Management API
  version: 1.0.0
  description: Manages Huawei IAM namespace mappings and permanent DevBridge API keys.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/iam/login:
    post:
      summary: Start a management login
      description: >-
        IAM headers must be supplied by a trusted IAM-authenticating gateway. The returned login
        token is valid for five minutes, can be used once, and is not an API key.
      security:
        - trustedIAMProxy: []
      parameters:
        - $ref: '#/components/parameters/IAMDomainId'
        - $ref: '#/components/parameters/IAMUserId'
        - $ref: '#/components/parameters/IAMUserName'
      responses:
        '200':
          description: One-time login session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/api-key:
    post:
      summary: Exchange a one-time login token for the first API key
      description: >-
        Creates a key for the principal's default namespace. After request validation, the login
        token is consumed atomically before persistence; a storage failure requires a new login.
      security:
        - loginToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
      responses:
        '201':
          description: Permanent API key; value is returned only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAPIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me:
    get:
      summary: Get the current API key identity
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Current identity and key permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/namespaces:
    get:
      summary: List namespaces owned by the current IAM principal
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Active namespaces; the default namespace is first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Namespace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a namespace
      description: The canonical namespace name is generated by the service and cannot be changed.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceRequest'
      responses:
        '201':
          description: Namespace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/namespaces/{namespaceId}:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    get:
      summary: Get a namespace
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Namespace metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Rename a namespace display label
      description: Only displayName can be changed; the canonical name remains stable.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceRequest'
      responses:
        '200':
          description: Namespace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a namespace
      description: >-
        Soft-deletes a non-default namespace and deletes its API keys. Relay resources are not
        deleted by this service. The default namespace cannot be deleted.
      security:
        - apiKeyAuth: []
      responses:
        '204':
          description: Namespace deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/namespaces/{namespaceId}/api-keys:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    get:
      summary: List API keys in a namespace
      description: Returns newest keys first. API key plaintext is never returned by list operations.
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: API key metadata
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/APIKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a permanent API key
      description: A namespace can have at most five API keys and key names must be unique within it.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyRequest'
      responses:
        '201':
          description: API key; value is returned only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAPIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/namespaces/{namespaceId}/api-keys/{keyId}:
    delete:
      summary: Delete an API key
      description: Deletes the credential immediately. The operation cannot recover its value.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/KeyId'
      responses:
        '204':
          description: API key deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    loginToken:
      type: http
      scheme: bearer
      bearerFormat: opaque one-time token
    trustedIAMProxy:
      type: apiKey
      in: header
      name: X-DevBridge-Proxy-Token
      description: Internal credential added by the trusted IAM gateway; never embedded in the CLI.
  parameters:
    IAMDomainId:
      name: X-IAM-Domain-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    IAMUserId:
      name: X-IAM-User-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    IAMUserName:
      name: X-IAM-User-Name
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      schema:
        type: string
        maxLength: 32
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        maxLength: 32
  schemas:
    Identity:
      type: object
      required: [accountNamespace, principalId, namespaceId, namespace]
      properties:
        accountNamespace:
          type: string
        principalId:
          type: string
        namespaceId:
          type: string
        namespace:
          type: string
        iamUserName:
          type: string
    AuthContext:
      allOf:
        - $ref: '#/components/schemas/Identity'
        - type: object
          required: [permission]
          properties:
            permission:
              type: string
              enum: [read, write]
    LoginSession:
      type: object
      required: [loginToken, expiresAt, identity]
      properties:
        loginToken:
          type: string
          writeOnly: true
        expiresAt:
          type: string
          format: date-time
        identity:
          $ref: '#/components/schemas/Identity'
    NamespaceRequest:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
    Namespace:
      type: object
      required: [id, name, displayName, default, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
          readOnly: true
        displayName:
          type: string
        default:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    APIKeyRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          default: default
          maxLength: 64
        permission:
          type: string
          default: write
          enum: [read, write]
    APIKey:
      type: object
      required: [id, name, mask, permission, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        mask:
          type: string
          example: ab...1234
        permission:
          type: string
          enum: [read, write]
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    IssuedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [value]
          properties:
            value:
              type: string
              pattern: '^[a-z0-9]{32}$'
              writeOnly: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: A write API key is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict or API key limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
