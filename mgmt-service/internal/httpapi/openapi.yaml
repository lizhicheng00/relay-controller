openapi: 3.0.3
info:
  title: DevBridge Management API
  version: 1.0.0
  description: Maps trusted cloud identities to DevBridge namespaces and API keys.
servers:
  - url: http://localhost:8080
paths:
  /v1/api-key:
    post:
      summary: Get the API key for a cloud user
      description: >-
        The trusted identity layer calls this endpoint after browser login. The same domain and
        user always receive the same API key and namespace. Users in one domain share an account
        namespace. Clients must not call this endpoint directly.
      security:
        - trustedIdentityProxy: []
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User namespace and API key
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me:
    get:
      summary: Get the identity mapped to an API key
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Current user identity and namespaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    trustedIdentityProxy:
      type: apiKey
      in: header
      name: X-DevBridge-Proxy-Token
      description: Internal credential held by the trusted identity layer.
  parameters:
    DomainId:
      name: X-Domain-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    Identity:
      type: object
      required: [domainId, userId, accountNamespace, namespace]
      properties:
        domainId:
          type: string
        userId:
          type: string
        accountNamespace:
          type: string
        namespace:
          type: string
    ProvisionedCredential:
      allOf:
        - $ref: '#/components/schemas/Identity'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              type: string
              pattern: '^[a-z0-9]{32}$'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
  responses:
    BadRequest:
      description: Invalid domain or user identity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
