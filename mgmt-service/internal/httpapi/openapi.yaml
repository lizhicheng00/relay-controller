openapi: 3.0.3
info:
  title: DevBridge Management API
  version: 1.0.0
  description: >-
    Maps trusted cloud identities to DevBridge namespaces and API keys. Every endpoint requires
    a mutually authenticated TLS connection.
servers:
  - url: https://localhost:8443
paths:
  /open-api-inner/v1/mgmt-service/api-keys/default:
    post:
      summary: Issue a cloud user's default API key for a scope
      description: >-
        Explicitly requested by an authenticated CLI or upper identity layer when an immediate
        business credential is needed. The service creates the user's namespace on first use
        and creates a permanent default API key. An existing default key must be deleted before
        another can be issued for the same scope.
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueDefaultAPIKeyRequest'
      responses:
        '200':
          description: User identity, namespaces, and default API key
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultAPIKeyCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /open-api-inner/v1/mgmt-service/api-keys/check:
    post:
      summary: Validate an API key and resolve its identity
      description: >-
        Used internally by business services. A valid key returns its current identity mapping
        and scope and records its latest use; an invalid or disabled key returns 401.
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Current user identity and namespaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /open-api-inner/v1/mgmt-service/api-keys:
    parameters:
      - $ref: '#/components/parameters/DomainId'
      - $ref: '#/components/parameters/UserId'
    get:
      summary: List API keys for the current namespace
      description: Returns metadata and masks only. Complete API key values are never listed.
      responses:
        '200':
          description: API keys grouped by scope with each default key first
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/APIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create an additional API key
      description: >-
        Creates one of at most four additional API keys for the requested scope. The complete
        value is returned only in this response and cannot be retrieved later. The scope determines
        whether the value starts with `devbridge_` or `devbox_`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: Additional API key created
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAPIKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /open-api-inner/v1/mgmt-service/api-keys/{keyId}:
    delete:
      summary: Delete an API key
      description: Deletes either a default or an additional API key.
      parameters:
        - $ref: '#/components/parameters/DomainId'
        - $ref: '#/components/parameters/UserId'
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z2-7]{26}$'
      responses:
        '204':
          description: API key deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    DomainId:
      name: X-Domain-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    UserId:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    NoStore:
      schema:
        type: string
        example: no-store
  schemas:
    Identity:
      type: object
      required: [domainId, userId, accountNamespace, namespace]
      properties:
        domainId:
          type: string
        userId:
          type: string
        accountNamespace:
          type: string
        namespace:
          type: string
    APIKeyIdentity:
      allOf:
        - $ref: '#/components/schemas/Identity'
        - type: object
          required: [scope]
          properties:
            scope:
              $ref: '#/components/schemas/APIKeyScope'
    DefaultAPIKeyCredential:
      allOf:
        - $ref: '#/components/schemas/Identity'
        - type: object
          required: [scope, apiKey]
          properties:
            scope:
              $ref: '#/components/schemas/APIKeyScope'
            apiKey:
              $ref: '#/components/schemas/APIKeyValue'
    APIKey:
      type: object
      required: [id, name, scope, mask, isDefault, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          pattern: '^[a-z2-7]{26}$'
        name:
          type: string
        scope:
          $ref: '#/components/schemas/APIKeyScope'
        mask:
          type: string
          example: devbridge_abcd...1234
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Most recent successful authentication time, updated at most once per minute.
    IssuedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              $ref: '#/components/schemas/APIKeyValue'
    APIKeyValue:
      type: string
      pattern: '^(devbridge|devbox)_[A-Za-z0-9_-]{32}$'
      description: Scope prefix followed by a 32-character unpadded Base64URL payload.
    APIKeyScope:
      type: string
      enum: [devbridge, devbox]
    IssueDefaultAPIKeyRequest:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/APIKeyScope'
    CreateAPIKeyRequest:
      type: object
      required: [name, scope]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A client or usage label. The name `default` is reserved within each scope.
        scope:
          $ref: '#/components/schemas/APIKeyScope'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [code, target, message]
      properties:
        code:
          type: string
        target:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: User identity or API key not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: API key name, per-scope limit, or existing default-key conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
